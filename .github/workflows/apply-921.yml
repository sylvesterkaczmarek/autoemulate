name: Apply model params filtering patch

on:
  push:
    branches:
      - fix-921-filter-model-params

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-921-filter-model-params
      - name: Apply patch
        run: python .github/scripts/apply_921.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: filter model params per emulator"
          git push origin HEAD:fix-921-filter-model-params
